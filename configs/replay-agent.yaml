# No GPU or model service is needed; actions still execute in the real sandbox.
model:
  class: ReplayModel
  replies:
    - |-
      Create and run a small Python program.
      ```bash
      cat > hello.py <<'PY'
      print('Hello from bashlet!')
      PY
      python3 hello.py
      ```
    - |-
      ```bash
      printf 'COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\nCreated hello.py.\n'
      ```
