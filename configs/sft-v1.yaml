# Two seeded passes through all 95 verified training demonstrations.
# Checkpoints after each pass; select only on the fixed development cohort.
dataset: runs/sft-reference-v1/manifest.json
base_model: Qwen/Qwen3.5-4B
model_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
rank: 16
seed: 4
train_mlp: true
train_attn: true
train_unembed: true
batch_size: 8
steps: 24
checkpoint_every: 12
learning_rate: 0.0001
ledger_path: runs/spend.sqlite3
spend_config: configs/spend.yaml
group: sft
timeout_seconds: 300
api_key_env: pytrio_api_key
dotenv_path: .env
monitor:
  project: bashlet
  entity: null
  group: issue07-sft-v1
  mode: online
  log_every: 1
  timeout_seconds: 20
