# Current OPSD: PyTRIO training and local vLLM evaluation.
# Paths are relative to this file. Historical runs use their recorded Git version.
condition:
  model:
    sampling:
      max_tokens: 1024
      temperature: 1.0
      top_p: 1.0
  budget:
    max_steps: 20
    max_generated_tokens: 16384
    max_seconds: 600.0
    max_consecutive_invalid: 3
train_manifest: ../runs/data/cohort/manifest.json
dev_plan: ../runs/data/cohort/harness-dev.json
backend:
  base_model: Qwen/Qwen3.5-4B
  model_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  source: base
  rank: 16
  seed: 31002
  train_attn: true
  train_mlp: true
  train_unembed: false
  thinking: true
  timeout_seconds: 300
  api_key_env: PYTRIO_API_KEY
  dotenv_path: ../.env
  tokenizer_cache_dir: ../runs/tokenizers
training:
  distillation_coefficient: 1.0
  learning_rate: 5.0e-06
  timeout_seconds: 300
  max_context_tokens: 32768
monitoring:
  project: bashlet
  mode: online
  dotenv_path: ../.env
  group: opsd-current
shuffle_seed: 31003
require_complete_training: true
evaluation:
  # Set this to your local model weights directory.
  base_path: ../runs/models/Qwen3.5-4B
  model:
    base_url: http://127.0.0.1:8004
    api_key_env: null
    timeout_seconds: 300
    max_retries: 0
  server:
    session: bashlet-opsd-vllm
    timeout_seconds: 600
    options:
      served-model-name: Qwen/Qwen3.5-4B
      host: 127.0.0.1
      port: 8004
      dtype: bfloat16
      max-model-len: 32768
      gpu-memory-utilization: 0.45
      max-num-seqs: 1
      enforce-eager: true
      generation-config: vllm
      language-model-only: true
output_dir: ../runs/opsd
group: opsd
training_selection: ../runs/data/cohort/training-selection.json
epochs: 2
evaluation_seeds:
- 4
- 17
- 29
- 41
- 53
evaluate_each_epoch: true
monitor:
  repository_root: ..
  worker_session: bashlet-opsd
  monitor_session: bashlet-opsd-monitor
  poll_seconds: 30
  backoff_min_seconds: 60
  backoff_max_seconds: 600
preparation:
  budget:
    max_steps: 6
    max_generated_tokens: 65536
    max_seconds: 600
  model:
    sampling:
      max_tokens: 32768
