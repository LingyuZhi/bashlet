# Issue 27: overlay local-base.yaml, then this file, then the protocol overlay.
# Keep the original-model sampling scheme from curated-harness-sampling-v1.yaml.
model:
  base_url: http://127.0.0.1:18027
  timeout_seconds: 120
  max_retries: 0
  sampling:
    max_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    seed: 4
budget:
  max_steps: 10
  max_generated_tokens: 8192
  max_seconds: 300.0
  max_consecutive_invalid: 3
