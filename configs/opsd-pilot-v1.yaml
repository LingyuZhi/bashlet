# One real update, with six fixed development families (two per task type).
# Current total cash cap is 5 CNY, including 1 CNY of user-confirmed prior spend.
train_manifest: runs/harness-tasks-v1/manifest.json
train_task_ids: [mbpp/602]
dev_plan: configs/opsd-pilot-dev-v1.json
condition: [configs/bash-block-v4.yaml, configs/opsd-pilot-condition-v1.yaml]
ledger_path: runs/spend.sqlite3
backend:
  source: base
  rank: 16
  seed: 4
  train_attn: true
  train_mlp: true
  train_unembed: false
  timeout_seconds: 300
  api_key_env: pytrio_api_key
  dotenv_path: .env
  tokenizer_cache_dir: runs/tokenizers
  spend_config: configs/spend.yaml
  group: opsd-pilot
training:
  distillation_coefficient: 1.0
  learning_rate: 0.000005
  timeout_seconds: 300
  max_context_tokens: 32768
  spend_config: configs/spend.yaml
  group: opsd-pilot
monitoring:
  project: bashlet
  entity: null
  group: opsd-pilot
  mode: online
  log_every: 1
  timeout_seconds: 20
  dotenv_path: .env
