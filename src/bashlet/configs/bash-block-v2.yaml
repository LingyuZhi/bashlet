# bash-block-v2 experimental condition. Later files and key=value overrides win.
protocol:
  name: bash-block-v2
  system_prompt: |-
    You are a programming agent working in an isolated Linux task workspace. The task instruction is provided in the first user message.

    Start each reply with THOUGHT: and explain the next action. Then provide exactly one non-empty fenced bash block, with ```bash and the closing ``` each on their own line:
    THOUGHT: Explain why this action helps with the task.
    ```bash
    your command here
    ```

    The block runs without network access in a fresh shell and a fresh sandbox, starting in the task workspace. Only workspace files persist between steps. Directory changes (cd), exported variables and background processes do not persist. Include any directory changes or environment settings needed by each command.

    The next user message contains the command's return code and combined stdout/stderr in their write order:
    <returncode>...</returncode>
    <output>
    ...
    </output>
    Long output is shown as its head and tail with the number of omitted characters and a hint to narrow your command. The command still runs to completion. Output beyond the sandbox's byte limit is discarded. A timeout has its own message and all processes from that step are terminated.

    To submit the current workspace and end the episode, run a command whose first output line is exactly COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT and whose exit code is 0. Any remaining output is recorded as your final submission text. For example:
    THOUGHT: The task is complete; I will submit the workspace.
    ```bash
    printf 'COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\n'
    ```
    A marker elsewhere in the output, in THOUGHT, or in a command that fails does not submit. Submission is final; you cannot run further commands afterwards.

    A reply with no bash block, multiple blocks, an empty block, or a reply cut off by the generation length limit is a format error. Nothing is executed, the step counts against your budget, and consecutive format errors terminate the episode at the configured limit.
  user_prompt: 'instruction verbatim as the first user message'
  observation_template: |-
    <returncode>{exit_code}</returncode>
    <output>
    {output}</output>
  timeout_template: |-
    The command timed out. All processes from this step were terminated.
    <returncode>{exit_code}</returncode>
    <output>
    {output}</output>
  observation_head_chars: 2000
  observation_tail_chars: 2000
  elision_template: |-
    [... {omitted_chars} characters omitted ...]
    Narrow the output with head, tail, sed, or a more selective search.
  output_limit_message: |-
    The sandbox output byte limit was reached; further output was discarded. Narrow the output with head, tail, sed, or a more selective search.
  invalid_action_format: |-
    <format_error>{reason}</format_error>
    Nothing was executed. Start with THOUGHT: and provide exactly one non-empty ```bash block.
  history: 'append-only token context: encoding.prompt(system, user), then per step the raw sampled tokens followed by encoding.continuation(tokens, feedback); earlier tokens are never decoded and re-encoded'
  submission_marker: COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
environment:
  id: linux-bwrap-v1
  bwrap: /usr/bin/bwrap
  timeout_seconds: 2.0
  output_bytes: 16384
  submission_bytes: 65536
  submission_files: 1024
  memory_bytes: 536870912
  file_bytes: 1048576
  nofile: 64
  path: /usr/bin:/bin
  lang: C.UTF-8
  ro_bind:
    - {source: /usr/bin, target: /usr/bin}
    - {source: /usr/lib, target: /usr/lib}
    - {source: /usr/lib64, target: /usr/lib64}
  symlink:
    - {source: usr/bin, target: /bin}
    - {source: usr/lib, target: /lib}
    - {source: usr/lib64, target: /lib64}
budget:
  max_steps: 10
  max_generated_tokens: 8192
  max_seconds: 120.0
  max_consecutive_invalid: 3
model:
  backend: adapter
  sampling:
    max_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    seed: null
  thinking: false
