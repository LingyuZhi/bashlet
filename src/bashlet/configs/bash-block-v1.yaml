# bash-block-v1 experimental condition. Later files and key=value overrides win.
protocol:
  name: bash-block-v1
  system_prompt: |-
    You are a programming agent working in a Linux shell. The current directory contains task.md (the task) and feedback_tests.py (tests you may run). Write the implementation to solution.py.

    Each reply must contain exactly one fenced block that starts with ```bash on its own line and ends with ``` on its own line. Text outside the block is allowed. The block is run with bash in the current directory, without network access. Each block runs in a fresh shell; only files in the current directory persist. To run the feedback tests, use a block that contains only `python3 feedback_tests.py`.

    The result is returned as the next message:
    <status>...</status>
    <exit_code>...</exit_code>
    <stdout>
    ...
    </stdout>
    <stderr>
    ...
    </stderr>

    When solution.py is final, reply with a block whose only content is submit:
    ```bash
    submit
    ```
    Submitting ends the task; solution.py is then graded with tests you cannot see. A reply without exactly one block, or cut off by the length limit, is not executed and counts against your step limit.
  user_prompt: 'task.prompt verbatim'
  observation_template: |-
    <status>{status}</status>
    <exit_code>{exit_code}</exit_code>
    <stdout>
    {stdout}</stdout>
    <stderr>
    {stderr}</stderr>
  invalid_action_format: |-
    <invalid_action>{reason}</invalid_action>
    Nothing was executed. Reply with exactly one ```bash block.
  history: 'append-only token context: encoding.prompt(system, user), then per step the raw sampled tokens followed by encoding.continuation(tokens, feedback); earlier tokens are never decoded and re-encoded'
  verification_pattern: '\s*python3 feedback_tests\.py\s*'
environment:
  id: linux-bwrap-v1
  bwrap: /usr/bin/bwrap
  timeout_seconds: 2.0
  output_bytes: 16384
  submission_bytes: 65536
  submission_files: 1024
  memory_bytes: 536870912
  file_bytes: 1048576
  nofile: 64
  path: /usr/bin:/bin
  lang: C.UTF-8
  ro_bind:
    - {source: /usr/bin, target: /usr/bin}
    - {source: /usr/lib, target: /usr/lib}
    - {source: /usr/lib64, target: /usr/lib64}
  symlink:
    - {source: usr/bin, target: /bin}
    - {source: usr/lib, target: /lib}
    - {source: usr/lib64, target: /lib64}
budget:
  max_steps: 10
  max_generated_tokens: 8192
  max_seconds: 120.0
  max_consecutive_invalid: 3
model:
  backend: adapter
  sampling:
    max_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    seed: null
  thinking: false
