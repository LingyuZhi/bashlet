[project]
name = "bashlet"
version = "0.1.0"
description = "A tiny coding agent with on-policy self-distillation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "huggingface-hub==0.36.0",
    "jinja2==3.1.6",
    "ml-dtypes==0.5.4",
    "numpy==2.5.3",
    "python-dotenv==1.2.1",
    "pytrio==0.2.9",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "tokenizers==0.22.1",
    "transformers==4.57.3",
    "wandb==0.30.0",
]

[tool.hatch.build.targets.wheel.force-include]
"configs/bash-block-v3.yaml" = "bashlet/configs/bash-block-v3.yaml"
"configs/spend.yaml" = "bashlet/configs/spend.yaml"
"configs/harness-authored-v1.json" = "bashlet/configs/harness-authored-v1.json"
"configs/harness-authored-v1.lock.json" = "bashlet/configs/harness-authored-v1.lock.json"
"configs/harness-cohort-v1.json" = "bashlet/configs/harness-cohort-v1.json"
"configs/harness-family-guard-v1.json" = "bashlet/configs/harness-family-guard-v1.json"
"configs/task-sources-v2.json" = "bashlet/configs/task-sources-v2.json"
"configs/harness-supplement-v2.json" = "bashlet/configs/harness-supplement-v2.json"
"configs/harness-supplement-v2.lock.json" = "bashlet/configs/harness-supplement-v2.lock.json"
"configs/harness-cohort-v2.json" = "bashlet/configs/harness-cohort-v2.json"
"configs/harness-cohort-v3.json" = "bashlet/configs/harness-cohort-v3.json"
"configs/harness-supplement-v3.json" = "bashlet/configs/harness-supplement-v3.json"
"configs/harness-supplement-v3.lock.json" = "bashlet/configs/harness-supplement-v3.lock.json"
"configs/mbpp-sanitized-v1.json" = "bashlet/configs/mbpp-sanitized-v1.json"
"configs/public-python-v1.lock.json" = "bashlet/configs/public-python-v1.lock.json"
"configs/public-python-v2.lock.json" = "bashlet/configs/public-python-v2.lock.json"
"configs/public-python-v3.lock.json" = "bashlet/configs/public-python-v3.lock.json"
"configs/public-python-v4.lock.json" = "bashlet/configs/public-python-v4.lock.json"
"configs/public-python-v5.lock.json" = "bashlet/configs/public-python-v5.lock.json"
"configs/opsd-public-import-v5.json" = "bashlet/configs/opsd-public-import-v5.json"
"configs/opsd-expanded-cohort-v8.json" = "bashlet/configs/opsd-expanded-cohort-v8.json"
"configs/opsd-expanded-plan-v1.json" = "bashlet/configs/opsd-expanded-plan-v1.json"
"configs/p3-native-v1.json" = "bashlet/configs/p3-native-v1.json"
"configs/p3-curated-v1.lock.json" = "bashlet/configs/p3-curated-v1.lock.json"
"configs/opsd-p3-import-v1.json" = "bashlet/configs/opsd-p3-import-v1.json"
"configs/mbpp-full-v1.json" = "bashlet/configs/mbpp-full-v1.json"
"configs/humaneval-v1.json" = "bashlet/configs/humaneval-v1.json"
"configs/cohort-quality-v1.yaml" = "bashlet/configs/cohort-quality-v1.yaml"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
bashlet = "bashlet.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
untyped_calls_exclude = ["transformers"]

[[tool.mypy.overrides]]
module = "transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytrio", "pytrio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wandb", "wandb.*"]
follow_imports = "skip"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
