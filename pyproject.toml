[project]
name = "bashlet"
version = "0.1.0"
description = "A tiny coding agent with on-policy self-distillation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "huggingface-hub==0.36.0",
    "jinja2==3.1.6",
    "ml-dtypes==0.5.4",
    "numpy==2.5.3",
    "python-dotenv==1.2.1",
    "pytrio==0.2.9",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "tokenizers==0.22.1",
    "transformers==4.57.3",
    "wandb==0.30.0",
]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "bashlet/configs"
"data" = "bashlet/data"

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true
exclude = ["/runs", "/outputs", "/environments/*/.venv"]
include = [
    "/src",
    "/configs/*.yaml",
    "/data/*.json",
    "/environments/*/pyproject.toml",
    "/environments/*/uv.lock",
    "/environments/*/server.env",
    "/scripts/*.sh",
    "/examples",
    "/assets",
    "/tests",
    "/docs/data-preparation.md",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
bashlet = "bashlet.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
untyped_calls_exclude = ["transformers"]

[[tool.mypy.overrides]]
module = "transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytrio", "pytrio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wandb", "wandb.*"]
follow_imports = "skip"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
