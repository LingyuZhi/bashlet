[project]
name = "bashlet"
version = "0.1.0"
description = "A tiny coding agent with on-policy self-distillation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "rich==15.0.0",
]

[tool.hatch.build.targets.wheel.force-include]
"configs/bash-block-v2.yaml" = "bashlet/configs/bash-block-v2.yaml"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
bashlet = "bashlet.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
